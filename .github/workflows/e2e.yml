name: e2e
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['src/**', 'tests/e2e/**', '.github/workflows/e2e.yml']
jobs:
  e2e:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v4
        with: { dotnet-version: '10.0.x' }
      - run: dotnet publish src/Taswib -c Release -r win-x64 --self-contained -p:DebugType=none -o out
      - name: Real-desktop test + screenshots
        shell: pwsh
        run: ./tests/e2e/run.ps1 -Exe "$PWD\out\Taswib.exe" -Out "$PWD\shots"
      - uses: actions/upload-artifact@v4
        if: always()
        with: { name: e2e, path: shots }

name: build
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
permissions:
  contents: write
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with: { dotnet-version: '8.0.x' }
      - name: Version
        shell: bash
        run: echo "VER=$(echo '${{ github.ref_name }}' | grep -E '^v[0-9.]+$' | sed 's/^v//' || true)" >> $GITHUB_ENV
      - name: Mapping check
        run: dotnet run --project tests/Taswib.Check
      - name: Publish exe
        run: >
          dotnet publish src/Taswib -c Release -r win-x64 --self-contained
          -p:PublishSingleFile=true -p:EnableCompressionInSingleFile=true
          -p:IncludeNativeLibrariesForSelfExtract=true -p:DebugType=none
          -p:Version=${{ env.VER || '0.0.0' }}
          -o out
      - uses: actions/upload-artifact@v4
        with: { name: Taswib.exe, path: out/Taswib.exe }
      - name: Release
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: gh release create "$GITHUB_REF_NAME" out/Taswib.exe --generate-notes
        env: { GH_TOKEN: '${{ github.token }}' }

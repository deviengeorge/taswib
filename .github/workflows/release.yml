name: build
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
permissions:
  contents: write
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v6
        with: { dotnet-version: '10.0.x' }
      - name: Version
        shell: bash
        run: echo "VER=$(echo '${{ github.ref_name }}' | grep -E '^v[0-9.]+$' | sed 's/^v//' || true)" >> $GITHUB_ENV
      - name: Mapping check
        run: dotnet run --project tests/Taswib.Check
      - name: Publish exe
        run: >
          dotnet publish src/Taswib -c Release -r win-x64 --self-contained
          -p:PublishSingleFile=true -p:EnableCompressionInSingleFile=true
          -p:IncludeNativeLibrariesForSelfExtract=true -p:DebugType=none
          -p:Version=${{ env.VER || '0.0.0' }}
          -o out
      - uses: actions/upload-artifact@v4
        with: { name: Taswib.exe, path: out/Taswib.exe }
      - name: Publish folder for installer (diffs well, so updates are small deltas)
        if: startsWith(github.ref, 'refs/tags/v')
        run: >
          dotnet publish src/Taswib -c Release -r win-x64 --self-contained
          -p:DebugType=none -p:Version=${{ env.VER }} -o pub
      - name: Publish small framework-dependent folder (needs the .NET 10 Runtime)
        if: startsWith(github.ref, 'refs/tags/v')
        run: >
          dotnet publish src/Taswib -c Release -r win-x64 --no-self-contained
          -p:DebugType=none -p:Version=${{ env.VER }} -o pub-fd
      - name: Installer (Velopack)
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: |
          dotnet tool install -g vpk --version 1.2.161
          vpk download github --repoUrl https://github.com/${{ github.repository }} --token ${{ github.token }} || echo "no previous release, full package only"
          vpk pack -u Taswib -v ${{ env.VER }} -p pub -e Taswib.exe -i src/Taswib/taswib.ico
          # small channel "fd": installed copies stay on it and update from it
          vpk download github --repoUrl https://github.com/${{ github.repository }} --token ${{ github.token }} --channel fd -o Releases-fd || echo "no previous fd release"
          vpk pack -u Taswib -v ${{ env.VER }} -p pub-fd -e Taswib.exe -i src/Taswib/taswib.ico --channel fd --framework net10.0-x64-runtime -o Releases-fd
          ls Releases Releases-fd
      - name: Release
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: gh release create "$GITHUB_REF_NAME" Releases/* Releases-fd/* out/Taswib.exe --generate-notes
        env: { GH_TOKEN: '${{ github.token }}' }

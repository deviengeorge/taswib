name: hash
on:
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to hash
        required: true
        default: v0.7.0
jobs:
  hash:
    runs-on: ubuntu-latest
    steps:
      - name: SHA-256 of the released installer
        env: { GH_TOKEN: '${{ github.token }}' }
        run: |
          gh release download "${{ inputs.tag }}" --repo "${{ github.repository }}" -p 'Taswib-win-Setup.exe'
          H=$(sha256sum Taswib-win-Setup.exe | cut -d' ' -f1 | tr a-z A-Z)
          echo "HASH=$H"
          echo "SHA256 ${{ inputs.tag }} Taswib-win-Setup.exe: \`$H\`" >> "$GITHUB_STEP_SUMMARY"

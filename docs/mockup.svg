<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 420" font-family="Segoe UI, Arial, sans-serif">
  <rect width="900" height="420" fill="#0f172a"/>
  <text x="450" y="40" fill="#e2e8f0" font-size="22" text-anchor="middle" font-weight="600">Taswib — fix wrong-layout text with one key</text>
  <!-- before -->
  <rect x="40" y="70" width="380" height="150" rx="10" fill="#1e293b" stroke="#334155"/>
  <text x="60" y="98" fill="#94a3b8" font-size="14">1. You typed on the English layout</text>
  <rect x="60" y="115" width="340" height="44" rx="6" fill="#0f172a" stroke="#475569"/>
  <text x="76" y="144" fill="#f87171" font-size="20" font-family="Consolas, monospace">high fd; ;dt phg;</text>
  <rect x="60" y="172" width="120" height="30" rx="6" fill="#334155"/>
  <text x="120" y="193" fill="#e2e8f0" font-size="14" text-anchor="middle">Pause</text>
  <text x="196" y="193" fill="#94a3b8" font-size="14">press one key</text>
  <!-- arrow -->
  <path d="M430 145 L470 145" stroke="#38bdf8" stroke-width="4" marker-end="url(#a)"/>
  <defs><marker id="a" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8 z" fill="#38bdf8"/></marker></defs>
  <!-- after -->
  <rect x="480" y="70" width="380" height="150" rx="10" fill="#1e293b" stroke="#334155"/>
  <text x="500" y="98" fill="#94a3b8" font-size="14">2. Fixed in place</text>
  <rect x="500" y="115" width="340" height="44" rx="6" fill="#0f172a" stroke="#22c55e"/>
  <text x="824" y="145" fill="#4ade80" font-size="22" text-anchor="end">اهلا بيك كيف حالك</text>
  <text x="500" y="193" fill="#94a3b8" font-size="14">No selection? It fixes the line before the cursor.</text>
  <!-- tray menu -->
  <rect x="40" y="250" width="380" height="150" rx="10" fill="#1e293b" stroke="#334155"/>
  <text x="60" y="278" fill="#94a3b8" font-size="14">Tray menu</text>
  <rect x="60" y="290" width="220" height="100" rx="6" fill="#0f172a" stroke="#475569"/>
  <text x="76" y="315" fill="#e2e8f0" font-size="14">Fix text now (Pause)</text>
  <text x="76" y="340" fill="#e2e8f0" font-size="14">✓ Start with Windows</text>
  <text x="76" y="365" fill="#e2e8f0" font-size="14">Check for updates</text>
  <text x="76" y="385" fill="#e2e8f0" font-size="14">Exit</text>
  <!-- reverse -->
  <rect x="480" y="250" width="380" height="150" rx="10" fill="#1e293b" stroke="#334155"/>
  <text x="500" y="278" fill="#94a3b8" font-size="14">Works both ways</text>
  <text x="500" y="318" fill="#f87171" font-size="20" text-anchor="start">اهلا</text>
  <text x="560" y="318" fill="#38bdf8" font-size="20">→</text>
  <text x="590" y="318" fill="#4ade80" font-size="20" font-family="Consolas, monospace">high</text>
  <text x="500" y="360" fill="#94a3b8" font-size="14">Direction auto-detected from the text.</text>
</svg>
